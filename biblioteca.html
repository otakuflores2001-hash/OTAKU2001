<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca - OTAKU2001</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="images/logo.png" alt="OTAKU2001">
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="biblioteca.html">Biblioteca</a>
            <a href="novedades.html">Novedades</a>
            <a href="apoyo.html">Apoyo</a>
        </nav>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar manga..."
                autocomplete="off"
            >

            <button id="searchButton">🔍</button>

        </div>

    </header>


    <main>

        <section class="library">

            <h1>Biblioteca</h1>

            <p class="library-description">
                Explora todos los mangas disponibles en OTAKU2001.
            </p>


            <div class="manga-grid">

                <div class="library-card">

                    <img src="images/asura.jpg"
                         alt="Portada de El Veredicto de Asura">

                    <div class="library-card-info">

                        <h2>El Veredicto de Asura</h2>

                        <p>
                            Traducción: En traducción
                        </p>

                        <p>
                            Publicación: En emisión
                        </p>

                        <a href="mangas/veredicto-de-asura.html">
                            VER MANGA
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

<script src="js/script.js"></script>

</body>

</html>
